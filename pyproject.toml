[project]
name = "freezbee-ha"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.11.0",
    "pytest",
    "pytest-homeassistant==2026.11.0",
    "yamllint==1.37.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:respx"
pythonpath = ["."]
filterwarnings = [
    "ignore",
    "default:::tests(\\.|$)",
]

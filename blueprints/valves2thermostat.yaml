blueprint:
  homeassistant:
    min_version: 2026.10.0
  domain: automation
  name: "Pilotage de thermostat central"
  author: "Netica"
  description: |
    Pilotez votre chauffage pièce par pièce.

    Assignez des têtes thermostatiques connectées à votre thermostat central
    pour envoyer les consignes optimales à votre chaudière.

  input:
    boiler:
      name: Thermostat central
      description: Le thermostat central à piloter (celui contrôlant votre chaudière)
      selector:
        entity:
          filter:
            - domain: climate
    valves:
      name: Têtes thermostatiques associées
      description: Liste des têtes thermostatiques associées à la zone de chauffage du thermostat central
      selector:
        entity:
          multiple: true
          reorder: true
          filter:
            - domain: climate
    algo:
      name: Algorithme à utiliser
      description: |
        - **Delta max** : *réactivité, confort optimal*
          La chaudière s’adapte à la pièce ayant le besoin en chauffage le plus élevé.
        - **Delta moyen** : *régulation douce*
          Les valeurs moyennes des pièces à chauffer sont utilisées pour calculer la consigne transmise à la chaudière.
      default: dmax
      selector:
        select:
          options:
            - label: Delta max
              value: dmax
            - label: Delta moyen
              value: davg
    active:
      name: J’ai lu l’avertissement et j’active cette automatisation
      description: >
        Je comprends que pour ne pas surcharger le circulateur de la chaudière,
        je laisse toujours au moins un radiateur ouvert, sans régulation automatique.
        Au besoin, je demande l’avis d’un spécialiste.
        J’accepte les termes de [la licence d’utilisation](https://github.com/netica-org/freezbee-ha/blob/main/LICENSE) de ce logiciel libre.

        <br/>Copyright © 2026 Netica SAS et contributeurs | [Code source](https://github.com/netica-org/freezbee-ha)
      default: false
      selector:
        boolean:

mode: restart
max_exceeded: silent

triggers:
  # on/off
  - trigger: state
    entity_id: !input valves
  # changement de consigne
  - trigger: state
    entity_id: !input valves
    attribute: temperature
  # suivi de la température ambiante du thermostat central
  - trigger: state
    entity_id: !input boiler
    attribute: current_temperature
  # vérification de la température ambiante toutes les 10 min
  - trigger: time_pattern
    minutes: "/10"

variables:
  boiler: !input boiler
  valves: !input valves
  algo: !input algo
  active: !input active
  INVALID_TEMP: -300

conditions:
  - condition: template
    value_template: "{{ active }}"

actions:
  # anti-rebond
  - delay: "00:00:05"

  - variables:
      analysis: >
        {% set ns = namespace(
          max_delta=INVALID_TEMP,
          max_delta_current_temp=INVALID_TEMP,
          max_delta_target_temp=INVALID_TEMP,
          max_delta_valve=none,
          open_valves_count=0,
          valid_valves_count=0,
          current_temp_sum=0,
          target_temp_sum=0,
        ) %}
        {% for valve in valves %}
          {% set valve_state = states(valve) %}
          {% if valve_state in ['unavailable', 'unknown'] %}
            {% continue %}
          {% endif %}

          {% set current_temp = state_attr(valve, 'current_temperature') | float(INVALID_TEMP) %}
          {% set target_temp = state_attr(valve, 'temperature') | float(INVALID_TEMP) %}

          {% if current_temp == INVALID_TEMP or target_temp == INVALID_TEMP %}
            {% continue %}
          {% endif %}

          {% set ns.valid_valves_count = ns.valid_valves_count + 1 %}

          {% set is_on = valve_state != 'off' %}
          {% set delta = target_temp - current_temp %}

          {% if is_on and delta > 0 %}
            {% set ns.open_valves_count = ns.open_valves_count + 1 %}
            {% set ns.current_temp_sum = ns.current_temp_sum + current_temp %}
            {% set ns.target_temp_sum = ns.target_temp_sum + target_temp %}
          {% endif %}

          {% if is_on and delta > ns.max_delta %}
            {% set ns.max_delta = delta %}
            {% set ns.max_delta_current_temp = current_temp %}
            {% set ns.max_delta_target_temp = target_temp %}
            {% set ns.max_delta_valve = state_attr(valve, 'friendly_name') %}
          {% endif %}
        {% endfor %}

        {% if algo == 'dmax' or ns.open_valves_count < 2 %}
          {% set current_temp = ns.max_delta_current_temp %}
          {% set target_temp = ns.max_delta_target_temp %}
          {% set delta = ns.max_delta %}
        {% else %}
          {% set current_temp = ns.current_temp_sum / ns.open_valves_count %}
          {% set target_temp = ns.target_temp_sum / ns.open_valves_count %}
          {% set delta = target_temp - current_temp %}
        {% endif %}

        {{ {
          'valid_valves_count': ns.valid_valves_count,
          'open_valves_count': ns.open_valves_count,
          'delta': delta | round(1),
          'max_delta_valve': ns.max_delta_valve,
        } }}
      log_algo: >
        {% if algo == 'dmax' %}
          Δmax {{ analysis.delta }}°C
          {{ '' if analysis.delta < 0 else analysis.max_delta_valve }}
        {% elif algo == 'davg' %}
          {% if analysis.open_valves_count > 0 %}
            Δmoy {{ analysis.delta }}°C
            | {{ analysis.open_valves_count }}/{{ analysis.valid_valves_count }} vannes ouvertes
          {% else %}
            {{ analysis.valid_valves_count }} vannes fermées
          {% endif %}
        {% else %}
          Algo non géré
        {% endif %}
      current_temp: "{{ state_attr(boiler, 'current_temperature') | float(INVALID_TEMP) | round(1) }}"
      target_temp: "{{ (current_temp + analysis.delta) | round(1) }}"
      old_target_temp: "{{ state_attr(boiler, 'temperature') | float(INVALID_TEMP) | round(1) }}"

  # ne fait rien s’il n’y a pas de vannes à prendre en compte
  - if:
    - condition: template
      value_template: "{{ analysis.valid_valves_count < 1 }}"
    then:
      - stop: "Aucune vanne disponible"

  # ne fait rien si le thermostat est indisponible
  - if:
    - condition: template
      value_template: "{{ states(boiler) in ['unavailable', 'unknown'] }}"
    then:
      - stop: "Thermostat central indisponible"

  - if:
    - condition: template
      value_template: "{{ current_temp == INVALID_TEMP }}"
    then:
      - stop: "Température ambiante du thermostat central invalide"

  # éteint le thermostat si toutes les vannes sont désactivées
  - if:
    - condition: template
      value_template: "{{ analysis.delta == INVALID_TEMP }}"
    then:
      - action: climate.turn_off
        target:
          entity_id: "{{ boiler }}"
      - stop: "Thermostat central éteint"

  # ne fait rien si le thermostat central est déjà à jour
  - if:
    - condition: template
      value_template: >
        {{ states(boiler) == 'heat'
          and old_target_temp == target_temp
        }}
    then:
      - stop: "Thermostat central déjà synchronisé"

  # met à jour le thermostat central
  - action: climate.set_temperature
    target:
      entity_id: "{{ boiler }}"
    data:
      hvac_mode: heat
      temperature: "{{ target_temp }}"

  # Enregistre l’activité
  - action: logbook.log
    data:
      name: "valves2thermostat_log"
      message: "{{ log_algo }}"
      domain: climate
      entity_id: "{{ this.entity_id }}"
